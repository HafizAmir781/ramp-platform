```html
<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAMP | Imam Registration Portal</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header class="page-header">

        <img
            src="../assets/logo/ramp-logo.png"
            alt="RAMP Logo"
            class="logo">

        <h1>RAMP</h1>

        <p>رابطہ آئمہ مساجد پنجاب</p>

    </header>

    <main class="container">

        <section class="card">

            <h2>امام رجسٹریشن فارم</h2>

            <p>براہِ کرم تمام ضروری معلومات درست درج کریں۔</p>

            <form id="registrationForm">

                <!-- Imam Name -->

                <div class="form-group">

                    <label for="imamName">
                        امام کا نام *
                    </label>

                    <input
                        type="text"
                        id="imamName"
                        placeholder="امام کا مکمل نام"
                        required>

                </div>

                <!-- Mobile -->

                <div class="form-group">

                    <label for="phone">
                        موبائل نمبر *
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="03XXXXXXXXX"
                        required>

                </div>

                <!-- Mosque Name -->

                <div class="form-group">

                    <label for="mosqueName">
                        مسجد کا نام *
                    </label>

                    <input
                        type="text"
                        id="mosqueName"
                        placeholder="جامع مسجد"
                        required>

                </div>

                <!-- District -->

                <div class="form-group">

                    <label for="district">
                        ضلع *
                    </label>

                    <select id="district" required>

                        <option value="">ضلع منتخب کریں</option>

                        <option>Lahore</option>
                        <option>Rawalpindi</option>
                        <option>Faisalabad</option>
                        <option>Multan</option>
                        <option>Gujranwala</option>
                        <option>Sialkot</option>
                        <option>Bahawalpur</option>

                    </select>

                </div>

                <!-- Tehsil -->

                <div class="form-group">

                    <label for="tehsil">
                        تحصیل *
                    </label>

                    <input
                        type="text"
                        id="tehsil"
                        placeholder="تحصیل"
                        required>

                </div>

                <!-- Address -->

                <div class="form-group">

                    <label for="address">
                        پتہ
                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="مکمل پتہ"></textarea>

                </div>

                <!-- Success Message -->

                <div
                    id="successMessage"
                    class="success-message">
                </div>

                <!-- Error Message -->

                <div
                    id="errorMessage"
                    class="error-message">
                </div>

                <!-- Submit -->

                <button
                    type="submit"
                    id="submitBtn">

                    امام رجسٹر کریں

                </button>

                <!-- Loading -->

                <div
                    id="loading"
                    style="display:none; margin-top:15px;">

                    محفوظ کیا جا رہا ہے...

                </div>

            </form>

        </section>

    </main>

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Project Files -->

    <script src="../js/firebase.js"></script>

    <script src="../js/register.js"></script>

</body>

</html>
```
